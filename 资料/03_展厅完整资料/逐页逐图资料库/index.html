<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未来设计实验室｜逐页逐图资料库</title><style>
:root{--ink:#182738;--muted:#52657b;--line:#dce4ec;--blue:#16647d;--bg:#f3f6fa;--white:#fff}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif;background:var(--bg)}header{padding:22px 30px 18px;background:#102d43;color:white}header h1{font-size:25px;margin:0 0 6px}header p{margin:0;color:#b7cfde}header a{color:#9ce2f3}.bar{display:flex;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:white;flex-wrap:wrap;position:sticky;top:0;z-index:3}.bar input{flex:1;min-width:240px}.bar input,.bar select,button{font:inherit;border:1px solid #bdccd9;border-radius:6px;padding:8px 12px;background:white;color:var(--ink)}button{cursor:pointer}button:hover{background:#eaf2f5}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1600px;margin:auto}aside{padding:20px 14px;position:sticky;top:72px;height:calc(100vh - 74px);overflow:auto;border-right:1px solid var(--line)}#count{font-size:13px;color:var(--muted);padding:0 8px 12px}#list button{display:block;width:100%;text-align:left;margin:0 0 8px;padding:10px;border:0;background:transparent;font-size:13px;line-height:1.5}#list button.active{background:#dcecf2;color:#095c76}#list strong{display:block;font-size:15px}main{padding:26px 34px;min-width:0}main h2{font-size:26px;line-height:1.5;margin:6px 0 14px}h3{font-size:20px;margin:30px 0 12px}h4{font-size:17px;margin:12px 0}p{white-space:pre-wrap}.tag{display:inline-block;padding:3px 9px;border-radius:4px;background:#dfedf2;margin:0 7px 7px 0;font-size:12px;color:#165c71}.muted{color:var(--muted);font-size:13px}.card{padding:22px;margin:20px 0;background:white;border:1px solid var(--line);border-radius:10px}.card>img,.preview img{width:100%;height:auto;max-height:750px;object-fit:contain;background:#edf1f5}.preview{background:white;padding:14px;border:1px solid var(--line);border-radius:8px}a{color:#096c8b;overflow-wrap:anywhere}pre{font:13px/1.75 ui-monospace,"PingFang SC",monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f9;padding:16px;border-radius:6px;max-height:650px;overflow:auto}details{margin:14px 0;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;font-weight:600;color:#185975}.regions{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.region{border:1px solid var(--line);border-radius:8px;padding:12px}.region img{width:100%;max-height:330px;object-fit:contain;background:#f5f7fa}.region p{font-size:13px}.warning{border-left:4px solid #d3a455;padding:12px 16px;background:#fff9ec;font-size:13px}.nav{display:flex;justify-content:space-between;gap:20px;margin:24px 0}.empty{padding:50px;color:var(--muted)}@media(max-width:800px){header{padding:20px}.layout{display:block}aside{position:static;height:220px;border-bottom:1px solid var(--line)}main{padding:20px 14px}.bar{position:static}header h1{font-size:21px}.card{padding:14px}main h2{font-size:22px}}
</style></head><body><header><h1>未来设计实验室 · 逐页逐图资料库</h1><p id="headline"></p><p><a href="../01_按飞书结构整理的详细资料.html">实验室资料库主题正文</a>　·　<a href="../02_逐页逐图全文与对应关系.md">逐页图文档案</a>　·　<a href="../08_公开知识条目.html">公开知识条目</a>　·　<a href="../03_页码与模块对应表.csv">页码与模块表</a></p></header><div class="bar"><input id="q" type="search" placeholder="搜索图片文字、人工解读、项目、页码（如 D59）"><select id="deck"><option value="">全部PPT</option></select><select id="module"><option value="">全部模块</option></select><button id="reset">重置筛选</button></div><div class="layout"><aside><div id="count"></div><div id="list"></div></aside><main id="main"></main></div><script src="data.js"></script><script>
const D=window.RESEARCH_DATA,A=Object.fromEntries(D.assets.map(a=>[a.id,a])),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current='',filtered=D.pages;
$('#headline').textContent=`${D.pages.length} 页 · ${D.assets.length} 张去重原图（含母版）· ${D.counts.regions} 个辅助分区 · 逐页保留对应关系`;
D.decks.forEach(d=>$('#deck').insertAdjacentHTML('beforeend',`<option value="${d.id}">${d.id}｜${esc(d.name)}</option>`));
[...new Set(D.pages.flatMap(p=>p.modules))].forEach(m=>$('#module').insertAdjacentHTML('beforeend',`<option>${esc(m)}</option>`));
const searchIndex=new Map(D.pages.map(p=>[p.id,[p.id,p.title,p.modules.join(' '),p.nativeText,p.notes,...p.pictures.map(o=>{let a=A[o.asset];return [a.id,a.key,a.note,...a.knowledgeIds.map(id=>D.researchSources[id].title+" "+D.researchSources[id].fact),a.ocrText,...a.tiles.map(t=>t.text)].join('\n')})].join('\n').toLowerCase()]));
function filter(){let q=$('#q').value.trim().toLowerCase(),deck=$('#deck').value,mod=$('#module').value;filtered=D.pages.filter(p=>(!deck||p.deck===deck)&&(!mod||p.modules.includes(mod))&&(!q||q.split(/\s+/).every(s=>searchIndex.get(p.id).includes(s))));$('#count').textContent=`当前 ${filtered.length} / 316 页`;drawList();if(!filtered.some(p=>p.id===current)){if(filtered.length)show(filtered[0].id);else $('#main').innerHTML='<div class="empty">没有匹配页面，可尝试项目名、关键词或图片编号。</div>'}}
function drawList(){$('#list').innerHTML=filtered.map(p=>`<button class="${p.id===current?'active':''}" data-page="${p.id}"><strong>${p.id}　${esc(p.title)}</strong>${esc(p.modules.join(' / '))}</button>`).join('')}
function ocr(t){return `<pre>${esc(t||'未检出文字；请结合人工说明和原图阅读。')}</pre>`}
function knowledge(ids,label='关联知识'){return ids?.length?`<details class="knowledge"><summary>${esc(label)} · ${ids.length} 项</summary>${ids.map(id=>{let k=D.researchSources[id];return `<h4><a href="../08_公开知识条目.html#${id}" target="_blank">${id}｜${esc(k.title)}</a></h4><p>${esc(k.fact)}</p><p class="muted"><a href="${esc(k.url)}" target="_blank">直接来源</a> · ${esc(k.date)}</p>`}).join('')}</details>`:''}
function renderPicture(o,i){let a=A[o.asset];return `<section class="card"><span class="tag">本页图 ${i+1} · ${a.id}</span><span class="tag">${esc(o.scope)}</span><h3>${esc(a.key)} · ${a.size.join(' × ')}</h3><p>${esc(a.note)}</p>${knowledge(a.knowledgeIds,"图像关联知识")}<a href="${a.src}" target="_blank"><img loading="lazy" style="width:100%;max-height:680px;object-fit:contain" src="${a.thumb||a.src}" alt="${esc(a.key)}"></a><p class="muted">点击打开完整原图。源文件：${esc(o.source)}${Object.keys(o.crop).length?'；页面存在裁切：'+esc(JSON.stringify(o.crop)):''}。实际版面位置请对照上方整页预览。</p>${a.regions.length?`<h4>小图与内容分区（${a.regions.length}）</h4><p class="muted">分区为阅读辅助，边界可能近似或重叠；完整源图是核对依据。</p><div class="regions">${a.regions.map((r,j)=>`<div class="region"><a href="${r.src}" target="_blank"><img loading="lazy" src="${r.src}" alt="${esc(r.label)}"></a><h4>${j+1}. ${esc(r.label)}</h4><p>${esc(r.description)}</p>${knowledge(r.knowledgeIds,"分区关联知识")}<details><summary>此分区识别文字</summary>${ocr(r.text)}</details></div>`).join('')}</div>`:''}<details><summary>查看整图机器识别文字 · ${a.ocr.length} 行</summary><p class="muted">保留机器原文；文字可能错序、漏字。上方人工解读与本栏识别文本是不同层级的资料。</p>${ocr(a.ocrText)}</details>${a.tiles.length?`<details><summary>查看密集文字的分块OCR · ${a.tiles.length} 块</summary>${a.tiles.map((t,j)=>`<h4>分块 ${j+1} · 原图像素区间 ${esc(JSON.stringify(t.box))}</h4>${ocr(t.text)}`).join('')}</details>`:''}<details><summary>同图出现位置与原文件内部对应</summary><p>${esc(a.aliases.join('\n'))}</p><p>${a.occurrences.map(x=>`<a href="#${x.page}">${x.page}</a>（${esc(x.scope)}）`).join('　')}</p><p class="muted">重复图在每一页均保留对应。相近而非完全相同的图片不会仅凭外观合并。</p></details></section>`}
function show(id){let p=D.pages.find(p=>p.id===id);if(!p)return;current=id;let idx=filtered.findIndex(x=>x.id===id);let direct=p.pictures.filter(o=>o.scope==='页面'),inherited=p.pictures.filter(o=>o.scope!=='页面');$('#main').innerHTML=`<div>${p.modules.map(m=>`<span class="tag">${esc(m)}</span>`).join('')}</div><h2>${p.id}｜${esc(p.title)}</h2><p class="muted">${esc(D.decks.find(d=>d.id===p.deck).name)} · 文件顺序第 ${p.page} 页</p><p class="muted">对应正文章节：${esc(p.bodySections||'见专题正文及页码表')}</p><div class="preview"><a href="${p.preview}" target="_blank"><img src="${p.preview}" alt="${p.id}整页预览"></a></div><p class="warning">${esc(D.caveat)}</p><details open><summary>页面原生文字、表格与备注</summary>${ocr(p.nativeText||'本页主要内容由图片承载，请阅读下方逐图资料。')}${p.objects.filter(o=>o.chartData).map(o=>`<h4>图表缓存数值</h4>${ocr(o.chartData.join(' / '))}`).join('')}${p.notes?`<h4>备注</h4>${ocr(p.notes)}`:''}</details>${p.references?.length?`<details open><summary>本页公开来源</summary><p class="muted">机构与项目记录、技术原理分别保留来源。</p><ul>${p.references.map(r=>`<li><a target="_blank" href="${esc(r.url)}">${esc(r.title)}</a>：${esc(r.reason)}</li>`).join('')}</ul></details>`:''}${knowledge(p.knowledgeIds,"本页关联知识")}<h3>页面图片 · ${direct.length} 个出现位置</h3>${direct.length?direct.map(renderPicture).join(''):'<p>本页未引用独立栅格图片；原生图形、连线与排版请结合整页预览及上述原生文字阅读。</p>'}${inherited.length?`<details><summary>版式与母版素材 · ${inherited.length} 个</summary><p class="muted">这里可能是背景或经过裁切的机构标识源图，不与项目正文图片混计。</p>${inherited.map(renderPicture).join('')}</details>`:''}<div class="nav">${idx>0?`<button data-page="${filtered[idx-1].id}">← ${filtered[idx-1].id}</button>`:'<span></span>'}${idx>=0&&idx<filtered.length-1?`<button data-page="${filtered[idx+1].id}">${filtered[idx+1].id} →</button>`:''}</div>`;drawList();history.replaceState(null,'','#'+id);window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){show(b.dataset.page);return}let a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();show(a.getAttribute('href').slice(1))}});let debounce;$('#q').addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(filter,180)});$('#deck').onchange=filter;$('#module').onchange=filter;$('#reset').onclick=()=>{$('#q').value='';$('#deck').value='';$('#module').value='';filter()};let h=location.hash.slice(1);filter();if(D.pages.some(p=>p.id===h))show(h);
</script></body></html>
