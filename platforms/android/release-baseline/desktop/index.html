<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小D · Robot Studio</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head><body>
<header><div class="brand"><span class="mark">D</span><div>小D <small>ROBOT STUDIO</small></div></div><span class="pill">与你自然交流</span><button id="toggleEditor">编辑外观</button><button id="export">导出编辑配置 ↗</button><label class="import">导入配置<input id="import" type="file" accept="application/json"></label></header>
<main><aside class="editor" id="editor"><details><summary>外观与动作编辑</summary><div class="eyebrow">01 / MOTION LIBRARY</div><h2>让小D动起来</h2><p>原始骨骼动作，自由预览与编辑。</p><input id="search" placeholder="搜索动作名称…"><div id="animations"></div><div class="row"><label><input id="loop" type="checkbox" checked>循环</label><button id="pause">暂停</button><button id="reset">复位</button></div><label>播放速度 <output id="speedValue">1.0×</output><input id="speed" type="range" min="0.1" max="2" step="0.1" value="1"></label><label>动作进度<input id="timeline" type="range" min="0" max="1" step="0.001" value="0"></label><div class="eyebrow">02 / EXPRESSION</div><div id="emotions"></div><div class="row"><label>外壳 <input id="shell" type="color"></label><label>灯光 <input id="glow" type="color"></label></div><label>发光强度<input id="intensity" type="range" min="0" max="3" step="0.1"></label><label><input id="rainbow" type="checkbox"> 彩虹灯光</label><details><summary>组件与骨骼</summary><div id="hierarchy"></div></details></details></aside>
<section class="viewport"><div class="view-title"><span id="assetStatus">正在唤醒小D…</span></div><canvas id="stage"></canvas><div class="view-bottom"><span id="currentAction">小D · READY</span><span id="expressionState" hidden></span><button id="cameraReset">重置视角</button></div><div id="fatal" hidden></div></section>
<aside class="right"><div class="eyebrow">CONVERSATION</div><h2>和小D聊聊</h2><p>说说你的想法，小D正在听。</p><div class="row"><button id="connect" class="primary">连接 AI</button><button id="disconnect">断开</button></div><p id="aiStatus" role="status">正在检查本地 AI 配置…</p><div id="messages" aria-live="polite"></div><form id="chat"><input id="text" placeholder="输入消息…" required maxlength="3000"><button>发送</button></form><div class="row"><button id="ptt" class="primary">按住说话 / V</button><button id="interrupt">打断</button></div><label><input type="checkbox" id="autoMic"> 自动收音（支持回声消除）</label><label>麦克风<select id="microphone"><option value="">系统默认</option></select></label><button id="vision">开启摄像头视觉</button><video id="camera" autoplay muted playsinline hidden></video><details><summary>编辑角色设定与音色</summary><label>音色<input id="voice"></label><label>角色提示词<textarea id="instructions" rows="9"></textarea></label><button id="applyAI">应用设定</button></details><details><summary>知识库与记忆</summary><p>已迁移实验室资料；个人记忆保存在本浏览器，可随配置导出。</p><textarea id="memory" rows="5" placeholder="输入你希望小D记住的内容…"></textarea><button id="saveMemory">保存记忆</button><button id="knowledge">查看原知识库</button></details></aside></main><script type="module" src="app.js?v=tour-scope-20261104"></script></body></html>
